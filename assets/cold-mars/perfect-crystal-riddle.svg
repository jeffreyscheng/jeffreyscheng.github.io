<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="title description">
  <title id="title">Timeline of the idealized feldspar experiment</title>
  <desc id="description">A newly formed Martian feldspar is magnified to show identical spherical grains, kept in a refrigerator from 1300 million years ago until the present, then examined in an Earth laboratory.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#676d69"/>
    </marker>
    <radialGradient id="grain" cx="35%" cy="28%">
      <stop offset="0" stop-color="#f4fbfd"/>
      <stop offset="0.55" stop-color="#d2e6eb"/>
      <stop offset="1" stop-color="#9dc5d2"/>
    </radialGradient>
    <g id="sphere">
      <circle r="34" fill="url(#grain)" stroke="#4f879c" stroke-width="3"/>
      <circle cx="-11" cy="-9" r="5" fill="#df7650"/>
    </g>
    <g id="rock">
      <path d="M-70 -3 C-40 -46 34 -51 72 -11 C104 23 77 69 18 76 C-42 84 -99 42 -70 -3 Z"
            fill="#e8edf0" stroke="#765a7d" stroke-width="5"/>
      <circle cx="-27" cy="10" r="16" fill="url(#grain)" stroke="#4f879c" stroke-width="2"/>
      <circle cx="11" cy="-2" r="16" fill="url(#grain)" stroke="#4f879c" stroke-width="2"/>
      <circle cx="35" cy="33" r="16" fill="url(#grain)" stroke="#4f879c" stroke-width="2"/>
      <circle cx="-12" cy="47" r="16" fill="url(#grain)" stroke="#4f879c" stroke-width="2"/>
    </g>
  </defs>
  <rect width="960" height="900" fill="#f7f5ef"/>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Literal time axis -->
    <line x1="100" y1="68" x2="100" y2="840" stroke="#676d69" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="86" y1="90" x2="114" y2="90" stroke="#676d69" stroke-width="3"/>
    <line x1="86" y1="795" x2="114" y2="795" stroke="#676d69" stroke-width="3"/>
    <text x="76" y="97" text-anchor="end" fill="#555b57" font-size="24">1300 My</text>
    <text x="76" y="802" text-anchor="end" fill="#555b57" font-size="24">present</text>

    <!-- Formation and geometric idealization -->
    <text x="150" y="58" fill="#59605c" font-size="25" letter-spacing="1.5">MARS · FORMATION</text>
    <path d="M158 285 L236 116 L314 285 Z" fill="#75665e"/>
    <path d="M200 197 L236 116 L271 200 L252 189 L235 212 L218 188 Z" fill="#df7650"/>
    <ellipse cx="236" cy="290" rx="102" ry="16" fill="#ead8d0"/>
    <g transform="translate(371 222) scale(.72)"><use href="#rock"/></g>
    <line x1="422" y1="202" x2="497" y2="153" stroke="#765a7d" stroke-width="3"/>
    <line x1="425" y1="255" x2="497" y2="306" stroke="#765a7d" stroke-width="3"/>
    <ellipse cx="650" cy="230" rx="170" ry="156" fill="#eef3f4" stroke="#765a7d" stroke-width="4"/>
    <g>
      <use href="#sphere" x="568" y="142"/>
      <use href="#sphere" x="650" y="142"/>
      <use href="#sphere" x="732" y="142"/>
      <use href="#sphere" x="527" y="213"/>
      <use href="#sphere" x="609" y="213"/>
      <use href="#sphere" x="691" y="213"/>
      <use href="#sphere" x="773" y="213"/>
      <use href="#sphere" x="568" y="284"/>
      <use href="#sphere" x="650" y="284"/>
      <use href="#sphere" x="732" y="284"/>
    </g>

    <!-- Long refrigerator interval -->
    <text x="253" y="352" fill="#59605c" font-size="25" letter-spacing="1.5">MARS · REFRIGERATOR</text>
    <rect x="253" y="371" width="345" height="304" rx="29" fill="#dcecf0" stroke="#47798e" stroke-width="5"/>
    <line x1="253" y1="479" x2="598" y2="479" stroke="#47798e" stroke-width="4"/>
    <line x1="545" y1="410" x2="545" y2="446" stroke="#47798e" stroke-width="8" stroke-linecap="round"/>
    <line x1="545" y1="528" x2="545" y2="568" stroke="#47798e" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#4c93bc" stroke-width="5" stroke-linecap="round">
      <line x1="379" y1="416" x2="477" y2="416"/>
      <line x1="428" y1="378" x2="428" y2="454"/>
      <line x1="394" y1="390" x2="463" y2="443"/>
      <line x1="463" y1="390" x2="394" y2="443"/>
    </g>
    <g transform="translate(421 563) scale(.72)"><use href="#rock"/></g>

    <!-- A single flat temperature trace; no prose repetition -->
    <line x1="667" y1="415" x2="860" y2="415" stroke="#c9c6bd" stroke-width="2"/>
    <line x1="667" y1="415" x2="667" y2="620" stroke="#c9c6bd" stroke-width="2"/>
    <line x1="684" y1="525" x2="843" y2="525" stroke="#df7650" stroke-width="5"/>
    <circle cx="684" cy="525" r="6" fill="#df7650"/>
    <circle cx="843" cy="525" r="6" fill="#df7650"/>
    <text x="764" y="504" text-anchor="middle" fill="#b85e3d" font-family="Georgia, 'Times New Roman', serif" font-size="25">T(t)</text>
    <text x="764" y="561" text-anchor="middle" fill="#59605c" font-size="22">unknown</text>
    <text x="764" y="586" text-anchor="middle" fill="#59605c" font-size="22">constant in time</text>

    <!-- Present-day transfer to the lab -->
    <text x="227" y="700" fill="#59605c" font-size="25" letter-spacing="1.5">EARTH · PRESENT</text>
    <g transform="translate(273 773) scale(.58)"><use href="#rock"/></g>
    <line x1="336" y1="773" x2="402" y2="773" stroke="#676d69" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M437 819 H533 L513 747 H458 Z" fill="#ead8c0" stroke="#a48c69" stroke-width="4"/>
    <path d="M466 747 V715 H505 V747" fill="none" stroke="#a48c69" stroke-width="4"/>
    <line x1="551" y1="773" x2="617" y2="773" stroke="#676d69" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="672" cy="773" r="43" fill="#fff" stroke="#765a7d" stroke-width="4"/>
    <line x1="672" y1="773" x2="698" y2="744" stroke="#df7650" stroke-width="5" stroke-linecap="round"/>
    <circle cx="672" cy="773" r="6" fill="#765a7d"/>
    <path d="M728 773 H817" stroke="#676d69" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="853" y="782" text-anchor="middle" fill="#765a7d" font-family="Georgia, 'Times New Roman', serif" font-size="34">?</text>
    <text x="552" y="860" text-anchor="middle" fill="#59605c" font-size="22">measure age + remaining ⁴⁰Ar</text>
    <text x="853" y="860" text-anchor="middle" fill="#765a7d" font-size="23">infer T</text>
  </g>
</svg>
