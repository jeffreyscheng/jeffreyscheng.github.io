<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">The Martian feldspar's potassium-40 budget at formation, discovery, and after irradiation</title>
  <desc id="description">Three pie charts of the Martian rock's original potassium-40. At formation on Mars it is all potassium-40. At discovery on Earth about a tenth is radiogenic argon-40. After neutron irradiation a wedge of argon-39, converted from potassium-39, is carved out of the potassium wedge and makes the surviving potassium measurable.</desc>
  <rect width="960" height="600" fill="#f7f5ef"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="30" y="50" width="300" height="175" fill="#e9c095"/>
    <rect x="30" y="225" width="300" height="175" fill="#b4664a"/>
    <rect x="330" y="50" width="300" height="175" fill="#a9d4e5"/>
    <rect x="330" y="225" width="300" height="175" fill="#87a06e"/>
    <rect x="630" y="50" width="300" height="175" fill="#a9d4e5"/>
    <rect x="630" y="225" width="300" height="175" fill="#87a06e"/>
    <line x1="330" y1="50" x2="330" y2="400" stroke="#f7f5ef" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="630" y1="50" x2="630" y2="400" stroke="#f7f5ef" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="30" y1="225" x2="930" y2="225" stroke="#3a3b37" stroke-width="2.5"/>
    <rect x="30" y="50" width="900" height="350" fill="none" stroke="#282b29" stroke-width="2.5"/>
    <text x="180" y="86" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">MARS · FORMATION</text>
    <text x="180" y="114" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">the clock starts</text>
    <circle cx="180.0" cy="225.0" r="100" fill="#f7f5ef" fill-opacity="0.55"/>
    <circle cx="180.0" cy="225.0" r="96" fill="#6f5a86"/>
    <circle cx="180.0" cy="225.0" r="96" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="180" y="352" text-anchor="middle" fill="#f7f5ef" font-size="22">all ⁴⁰K, no argon yet</text>
    <text x="480" y="86" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">EARTH · LABORATORY</text>
    <text x="480" y="114" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">at discovery</text>
    <circle cx="480.0" cy="225.0" r="100" fill="#f7f5ef" fill-opacity="0.55"/>
    <path d="M480.0 225.0 L480.00 129.00 A96 96 0 0 1 537.18 147.88 Z" fill="#df7650"/>
    <path d="M480.0 225.0 L537.18 147.88 A96 96 0 1 1 480.00 129.00 Z" fill="#6f5a86"/>
    <line x1="480.0" y1="225.0" x2="480.00" y2="129.00" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="480.0" y1="225.0" x2="537.18" y2="147.88" stroke="#f7f5ef" stroke-width="2.5"/>
    <circle cx="480.0" cy="225.0" r="96" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="480" y="352" text-anchor="middle" fill="#f7f5ef" font-size="22">⁴⁰K decayed into ⁴⁰Ar</text>
    <text x="480" y="379" text-anchor="middle" fill="#f7f5ef" fill-opacity="0.85" font-size="20">the ratio gives the age</text>
    <text x="780" y="86" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">EARTH · LABORATORY</text>
    <text x="780" y="114" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">after irradiation</text>
    <circle cx="780.0" cy="225.0" r="100" fill="#f7f5ef" fill-opacity="0.55"/>
    <path d="M780.0 225.0 L780.00 129.00 A96 96 0 0 1 837.18 147.88 Z" fill="#df7650"/>
    <path d="M780.0 225.0 L837.18 147.88 A96 96 0 0 1 874.16 243.72 Z" fill="#3f86b0"/>
    <path d="M780.0 225.0 L874.16 243.72 A96 96 0 1 1 780.00 129.00 Z" fill="#6f5a86"/>
    <line x1="780.0" y1="225.0" x2="780.00" y2="129.00" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="225.0" x2="837.18" y2="147.88" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="225.0" x2="874.16" y2="243.72" stroke="#f7f5ef" stroke-width="2.5"/>
    <circle cx="780.0" cy="225.0" r="96" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="780" y="352" text-anchor="middle" fill="#f7f5ef" font-size="22">neutrons made ³⁹Ar from ³⁹K</text>
    <text x="780" y="379" text-anchor="middle" fill="#f7f5ef" fill-opacity="0.85" font-size="20">potassium is now visible</text>
    <defs><marker id="tarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#59605c"/></marker></defs>
    <line x1="180" y1="470" x2="918" y2="470" stroke="#59605c" stroke-width="3" marker-end="url(#tarrow)"/>
    <line x1="180" y1="459" x2="180" y2="481" stroke="#59605c" stroke-width="3"/>
    <text x="180" y="508" text-anchor="middle" fill="#59605c" font-size="22">1300 My ago</text>
    <line x1="480" y1="459" x2="480" y2="481" stroke="#59605c" stroke-width="3"/>
    <text x="480" y="508" text-anchor="middle" fill="#59605c" font-size="22">present</text>
    <line x1="780" y1="459" x2="780" y2="481" stroke="#59605c" stroke-width="3"/>
    <text x="780" y="508" text-anchor="middle" fill="#59605c" font-size="22">weeks later</text>
    <text x="330" y="450" text-anchor="middle" fill="#59605c" font-size="21">1.3 billion years</text>
    <line x1="619" y1="479" x2="629" y2="461" stroke="#f7f5ef" stroke-width="4"/>
    <line x1="629" y1="479" x2="639" y2="461" stroke="#f7f5ef" stroke-width="4"/>
    <text x="630" y="450" text-anchor="middle" fill="#59605c" font-size="21">days in a reactor</text>
    <rect x="203" y="530" width="19" height="19" rx="3" fill="#6f5a86" stroke="#282b29" stroke-width="1.5"/>
    <text x="235" y="545" fill="#59605c" font-size="21">⁴⁰K</text>
    <rect x="296" y="530" width="19" height="19" rx="3" fill="#df7650" stroke="#282b29" stroke-width="1.5"/>
    <text x="328" y="545" fill="#59605c" font-size="21">radiogenic ⁴⁰Ar</text>
    <rect x="511" y="530" width="19" height="19" rx="3" fill="#3f86b0" stroke="#282b29" stroke-width="1.5"/>
    <text x="543" y="545" fill="#59605c" font-size="21">³⁹Ar from irradiation</text>
  </g>
</svg>
