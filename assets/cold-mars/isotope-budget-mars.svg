<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title description">
  <title id="title">evolution of ⁴⁰K in a cold Martian rock</title>
  <desc id="description">Three pie charts of the Martian rock's original potassium-40. At formation on Mars it is all potassium-40. At discovery on Earth about a tenth is radiogenic argon-40. After neutron irradiation a wedge of argon-39, converted from potassium-39, is carved out of the potassium wedge and makes the surviving potassium measurable.</desc>
  <rect width="960" height="630" fill="#f7f5ef"/>
  <text x="480" y="38" text-anchor="middle" fill="#282b29" font-family="Georgia, 'Times New Roman', serif" font-size="27">evolution of ⁴⁰K in a cold Martian rock</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="30" y="62" width="300" height="200" fill="#e9c095"/>
    <rect x="30" y="262" width="300" height="200" fill="#b4664a"/>
    <rect x="330" y="62" width="300" height="200" fill="#a9d4e5"/>
    <rect x="330" y="262" width="300" height="200" fill="#87a06e"/>
    <rect x="630" y="62" width="300" height="200" fill="#a9d4e5"/>
    <rect x="630" y="262" width="300" height="200" fill="#87a06e"/>
    <line x1="330" y1="62" x2="330" y2="462" stroke="#f7f5ef" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="630" y1="62" x2="630" y2="462" stroke="#f7f5ef" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="30" y1="262" x2="930" y2="262" stroke="#3a3b37" stroke-width="2.5"/>
    <rect x="30" y="62" width="900" height="400" fill="none" stroke="#282b29" stroke-width="2.5"/>
    <text x="180" y="92" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">MARS · FORMATION</text>
    <text x="180" y="118" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">the clock starts</text>
    <circle cx="180.0" cy="262.0" r="88" fill="#f7f5ef" fill-opacity="0.55"/>
    <circle cx="180.0" cy="262.0" r="84" fill="#6f5a86"/>
    <circle cx="180.0" cy="262.0" r="84" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="180" y="319" text-anchor="middle" fill="#f7f5ef" font-size="24">⁴⁰K</text>
    <text x="180" y="404" text-anchor="middle" fill="#f7f5ef" font-size="22">all ⁴⁰K, no argon yet</text>
    <text x="480" y="92" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">EARTH · LABORATORY</text>
    <text x="480" y="118" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">at discovery</text>
    <circle cx="480.0" cy="262.0" r="88" fill="#f7f5ef" fill-opacity="0.55"/>
    <path d="M480.0 262.0 L480.00 178.00 A84 84 0 0 1 530.03 194.52 Z" fill="#df7650"/>
    <path d="M480.0 262.0 L530.03 194.52 A84 84 0 1 1 480.00 178.00 Z" fill="#6f5a86"/>
    <line x1="480.0" y1="262.0" x2="480.00" y2="178.00" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="480.0" y1="262.0" x2="530.03" y2="194.52" stroke="#f7f5ef" stroke-width="2.5"/>
    <circle cx="480.0" cy="262.0" r="84" fill="none" stroke="#282b29" stroke-width="3"/>
    <line x1="505.0" y1="186.2" x2="566.0" y2="156.0" stroke="#282b29" stroke-width="1.6"/>
    <text x="572.0" y="162.0" fill="#282b29" font-size="21">⁴⁰Ar</text>
    <text x="465" y="316" text-anchor="middle" fill="#f7f5ef" font-size="24">⁴⁰K</text>
    <text x="480" y="404" text-anchor="middle" fill="#f7f5ef" font-size="22">⁴⁰K decayed into ⁴⁰Ar</text>
    <text x="480" y="430" text-anchor="middle" fill="#f7f5ef" fill-opacity="0.85" font-size="20">the ratio gives the age</text>
    <text x="780" y="92" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">EARTH · LABORATORY</text>
    <text x="780" y="118" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">after irradiation</text>
    <circle cx="780.0" cy="262.0" r="88" fill="#f7f5ef" fill-opacity="0.55"/>
    <path d="M780.0 262.0 L780.00 178.00 A84 84 0 0 1 830.03 194.52 Z" fill="#df7650"/>
    <path d="M780.0 262.0 L830.03 194.52 A84 84 0 0 1 862.39 278.38 Z" fill="#3f86b0"/>
    <path d="M780.0 262.0 L862.39 278.38 A84 84 0 1 1 780.00 178.00 Z" fill="#6f5a86"/>
    <line x1="780.0" y1="262.0" x2="780.00" y2="178.00" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="262.0" x2="830.03" y2="194.52" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="262.0" x2="862.39" y2="278.38" stroke="#f7f5ef" stroke-width="2.5"/>
    <circle cx="780.0" cy="262.0" r="84" fill="none" stroke="#282b29" stroke-width="3"/>
    <line x1="805.0" y1="186.2" x2="866.0" y2="156.0" stroke="#282b29" stroke-width="1.6"/>
    <text x="872.0" y="162.0" fill="#282b29" font-size="21">⁴⁰Ar</text>
    <line x1="854.4" y1="233.3" x2="866.0" y2="186.0" stroke="#282b29" stroke-width="1.6"/>
    <text x="872.0" y="192.0" fill="#282b29" font-size="21">³⁹Ar</text>
    <text x="742" y="301" text-anchor="middle" fill="#f7f5ef" font-size="24">⁴⁰K</text>
    <text x="780" y="404" text-anchor="middle" fill="#f7f5ef" font-size="22">neutrons made ³⁹Ar from ³⁹K</text>
    <text x="780" y="430" text-anchor="middle" fill="#f7f5ef" fill-opacity="0.85" font-size="20">potassium is now visible</text>
    <defs><marker id="tarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#59605c"/></marker></defs>
    <line x1="180" y1="462" x2="160" y2="518" stroke="#59605c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="480" y1="462" x2="700" y2="518" stroke="#59605c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="780" y1="462" x2="770" y2="518" stroke="#59605c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="130" y1="530" x2="918" y2="530" stroke="#59605c" stroke-width="3" marker-end="url(#tarrow)"/>
    <line x1="160" y1="519" x2="160" y2="541" stroke="#59605c" stroke-width="3"/>
    <text x="160" y="568" text-anchor="middle" fill="#59605c" font-size="22">1300 My ago</text>
    <line x1="700" y1="519" x2="700" y2="541" stroke="#59605c" stroke-width="3"/>
    <text x="700" y="568" text-anchor="middle" fill="#59605c" font-size="22">present</text>
    <line x1="770" y1="519" x2="770" y2="541" stroke="#59605c" stroke-width="3"/>
    <text x="770" y="598" text-anchor="middle" fill="#59605c" font-size="22">weeks later</text>
    <text x="430" y="508" text-anchor="middle" fill="#59605c" font-size="21">1.3 billion years</text>
    <text x="735" y="508" text-anchor="middle" fill="#59605c" font-size="21">days</text>
  </g>
</svg>
