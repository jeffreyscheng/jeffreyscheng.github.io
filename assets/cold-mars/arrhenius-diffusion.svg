<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" role="img" aria-labelledby="title description">
  <title id="title">Pictorial derivation of Arrhenius diffusion for argon in ideal feldspar</title>
  <desc id="description">Argon rattles in a stable cage and must cross an energy barrier to reach the next cage. A Boltzmann factor gives the fraction of thermal attempts that reach the transition state. Multiplying this fraction by the attempt frequency gives the jump rate, and converting an unbiased random walk of fixed-length jumps into diffusivity yields the Arrhenius equation.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#656b67"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#df7650"/>
    </marker>
  </defs>
  <rect width="960" height="1000" fill="#f7f5ef"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="480" y="50" text-anchor="middle" fill="#252927" font-family="Georgia, 'Times New Roman', serif" font-size="30">why argon diffusion has an Arrhenius form</text>

    <!-- 1. Microscopic geometry and barrier -->
    <rect x="30" y="82" width="900" height="326" rx="22" fill="#fff" stroke="#d4d0c6" stroke-width="2"/>
    <text x="58" y="119" fill="#59605c" font-size="19" letter-spacing="1.2">1 · A HOP THROUGH SOLID FELDSPAR HAS AN ENERGY COST</text>

    <!-- Repeating tetrahedral/cage cartoon -->
    <g transform="translate(95 157) scale(.78)">
      <g fill="none" stroke="#7da6b5" stroke-width="3">
        <path d="M0 62 L62 25 L124 62 L124 134 L62 171 L0 134 Z"/>
        <path d="M124 62 L186 25 L248 62 L248 134 L186 171 L124 134 Z"/>
        <path d="M248 62 L310 25 L372 62 L372 134 L310 171 L248 134 Z"/>
        <path d="M62 171 L124 134 L186 171 L186 243 L124 280 L62 243 Z"/>
        <path d="M186 171 L248 134 L310 171 L310 243 L248 280 L186 243 Z"/>
      </g>
      <g fill="#b7d6df" stroke="#4d8499" stroke-width="2">
        <circle cx="62" cy="25" r="8"/><circle cx="124" cy="62" r="8"/>
        <circle cx="186" cy="25" r="8"/><circle cx="248" cy="62" r="8"/>
        <circle cx="310" cy="25" r="8"/><circle cx="372" cy="62" r="8"/>
        <circle cx="62" cy="171" r="8"/><circle cx="186" cy="171" r="8"/>
        <circle cx="310" cy="171" r="8"/><circle cx="124" cy="280" r="8"/>
        <circle cx="248" cy="280" r="8"/>
      </g>
      <circle cx="124" cy="118" r="20" fill="#df7650" stroke="#b85e3d" stroke-width="3"/>
      <text x="124" y="125" text-anchor="middle" fill="#fff" font-size="17">Ar</text>
      <circle cx="248" cy="118" r="20" fill="#fff" stroke="#765a7d" stroke-width="3" stroke-dasharray="5 4"/>
      <path d="M148 118 H221" stroke="#df7650" stroke-width="4" marker-end="url(#arrow-orange)"/>
      <text x="186" y="102" text-anchor="middle" fill="#b85e3d" font-size="18">jump length ℓ</text>
      <text x="124" y="213" text-anchor="middle" fill="#59605c" font-size="17">stable cage</text>
      <text x="248" y="213" text-anchor="middle" fill="#59605c" font-size="17">neighboring cage</text>
      <path d="M176 129 Q186 109 196 129" fill="none" stroke="#765a7d" stroke-width="5"/>
      <text x="186" y="151" text-anchor="middle" fill="#765a7d" font-size="15">bottleneck</text>
    </g>

    <!-- Energy along path -->
    <g transform="translate(545 155) scale(.82)">
      <line x1="24" y1="229" x2="380" y2="229" stroke="#6a706c" stroke-width="2" marker-end="url(#arrow-dark)"/>
      <line x1="24" y1="229" x2="24" y2="4" stroke="#6a706c" stroke-width="2" marker-end="url(#arrow-dark)"/>
      <text x="205" y="263" text-anchor="middle" fill="#59605c" font-size="17">position along the hop</text>
      <text x="-1" y="117" text-anchor="middle" fill="#59605c" font-size="17" transform="rotate(-90 -1 117)">potential energy</text>
      <path d="M32 177 C92 177 101 206 137 206 C173 206 167 62 205 49 C243 62 237 206 273 206 C310 206 318 177 372 177"
            fill="none" stroke="#765a7d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="137" cy="206" r="7" fill="#df7650"/>
      <circle cx="273" cy="206" r="7" fill="#fff" stroke="#765a7d" stroke-width="3"/>
      <line x1="205" y1="206" x2="205" y2="49" stroke="#df7650" stroke-width="3" stroke-dasharray="7 6"/>
      <path d="M193 196 H217 M193 57 H217" stroke="#df7650" stroke-width="3"/>
      <text x="226" y="133" fill="#b85e3d" font-size="19">Eₐ</text>
      <text x="205" y="28" text-anchor="middle" fill="#765a7d" font-size="17">transition state</text>
    </g>

    <text x="480" y="386" text-anchor="middle" fill="#4f5652" font-size="16">neutral Ar can occupy cage space, but the solid lattice presents a repeatable bottleneck between neighboring cages</text>

    <!-- 2. Boltzmann factor and jump rate -->
    <rect x="30" y="432" width="900" height="266" rx="22" fill="#fff" stroke="#d4d0c6" stroke-width="2"/>
    <text x="58" y="469" fill="#59605c" font-size="19" letter-spacing="1.2">2 · THERMAL VIBRATIONS MAKE REPEATED ATTEMPTS</text>

    <g transform="translate(72 503)">
      <circle cx="75" cy="70" r="44" fill="#dcecf0" stroke="#47798e" stroke-width="3"/>
      <circle cx="75" cy="70" r="17" fill="#df7650"/>
      <path d="M75 42 L75 18 M48 52 L29 37 M102 52 L121 37 M48 88 L27 103 M102 88 L123 103"
            stroke="#4c93bc" stroke-width="4" stroke-linecap="round"/>
      <text x="75" y="137" text-anchor="middle" fill="#59605c" font-size="17">attempt frequency ν₀</text>
    </g>

    <path d="M236 574 H286" stroke="#6a706c" stroke-width="4" marker-end="url(#arrow-dark)"/>

    <g transform="translate(304 507)">
      <text x="0" y="25" fill="#252927" font-size="18">thermal equilibrium assigns each state</text>
      <text x="0" y="55" fill="#252927" font-size="18">a Boltzmann weight proportional to</text>
      <text x="163" y="101" text-anchor="middle" fill="#765a7d" font-family="Georgia, 'Times New Roman', serif" font-size="26">exp[−E/(k<tspan baseline-shift="sub" font-family="Inter, Arial, sans-serif" font-size="17">B</tspan>T)]</text>
      <text x="163" y="143" text-anchor="middle" fill="#59605c" font-size="17">barrier / cage weight ratio</text>
      <text x="163" y="176" text-anchor="middle" fill="#b85e3d" font-family="Georgia, 'Times New Roman', serif" font-size="25">= exp[−Eₐ/(k<tspan baseline-shift="sub" font-family="Inter, Arial, sans-serif" font-size="16">B</tspan>T)]</text>
    </g>

    <path d="M652 574 H702" stroke="#6a706c" stroke-width="4" marker-end="url(#arrow-dark)"/>

    <g transform="translate(720 514)">
      <rect x="0" y="0" width="174" height="126" rx="16" fill="#f4e8e0" stroke="#d8a78e" stroke-width="2"/>
      <text x="87" y="34" text-anchor="middle" fill="#252927" font-size="18">successful hops</text>
      <text x="87" y="63" text-anchor="middle" fill="#59605c" font-size="17">per second</text>
      <text x="87" y="103" text-anchor="middle" fill="#b85e3d" font-family="Georgia, 'Times New Roman', serif" font-size="21">Γ(T)=ν₀e<tspan baseline-shift="super" font-family="Inter, Arial, sans-serif" font-size="13">−Eₐ/kBT</tspan></text>
    </g>

    <!-- 3. Random walk becomes diffusivity -->
    <rect x="30" y="722" width="900" height="234" rx="22" fill="#fff" stroke="#d4d0c6" stroke-width="2"/>
    <text x="58" y="759" fill="#59605c" font-size="19" letter-spacing="1.2">3 · MANY UNBIASED HOPS BECOME DIFFUSION</text>

    <g transform="translate(75 797)">
      <g stroke="#d5d8d5" stroke-width="1.5">
        <path d="M0 0 H270 M0 42 H270 M0 84 H270 M0 126 H270"/>
        <path d="M0 0 V126 M45 0 V126 M90 0 V126 M135 0 V126 M180 0 V126 M225 0 V126 M270 0 V126"/>
      </g>
      <path d="M45 84 L90 84 L90 42 L135 42 L180 42 L180 84 L225 84 L225 126 L270 126"
            fill="none" stroke="#2e79a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="45" cy="84" r="9" fill="#df7650"/>
      <circle cx="270" cy="126" r="9" fill="#765a7d"/>
      <text x="45" y="113" text-anchor="middle" fill="#b85e3d" font-size="15">start</text>
      <text x="242" y="112" fill="#765a7d" font-size="15">later</text>
      <text x="144" y="151" text-anchor="middle" fill="#59605c" font-size="16">each uncorrelated hop has length ℓ</text>
    </g>

    <g transform="translate(408 795)">
      <text x="0" y="25" fill="#252927" font-family="Georgia, 'Times New Roman', serif" font-size="23">⟨distance²⟩ = Γ(T)tℓ² = 6D(T)t</text>
      <text x="0" y="71" fill="#252927" font-family="Georgia, 'Times New Roman', serif" font-size="23">D(T) = (ℓ²ν₀/6) exp[−Eₐ/(k<tspan baseline-shift="sub" font-family="Inter, Arial, sans-serif" font-size="15">B</tspan>T)]</text>
      <rect x="-8" y="98" width="459" height="58" rx="12" fill="#eee7f0" stroke="#bea7c5" stroke-width="2"/>
      <text x="221" y="135" text-anchor="middle" fill="#765a7d" font-family="Georgia, 'Times New Roman', serif" font-size="27">D(T) = D₀ exp[−Eₐ/(R<tspan baseline-shift="sub" font-family="Inter, Arial, sans-serif" font-size="17">g</tspan>T)]</text>
    </g>
    <text x="480" y="981" text-anchor="middle" fill="#666b67" font-size="16">for molar Eₐ use R<tspan baseline-shift="sub" font-size="12">g</tspan>; jump geometry and correlations are absorbed into D₀</text>
  </g>
</svg>
