<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title description">
  <title id="title">A perfect warm rock is impossible to date</title>
  <desc id="description">The same three pie charts for a rock that did not stay cold. A black wedge in the discovery and post-irradiation pies stands for radiogenic argon-40 that diffused out of the crystal. Its size is unknown, so the surviving argon-to-potassium ratio no longer gives the true age.</desc>
  <rect width="960" height="670" fill="#f7f5ef"/>
  <text x="480" y="38" text-anchor="middle" fill="#282b29" font-family="Georgia, 'Times New Roman', serif" font-size="27">A perfect warm rock is impossible to date</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="30" y="62" width="300" height="220" fill="#e9c095"/>
    <rect x="30" y="282" width="300" height="220" fill="#b4664a"/>
    <rect x="330" y="62" width="300" height="220" fill="#a9d4e5"/>
    <rect x="330" y="282" width="300" height="220" fill="#87a06e"/>
    <rect x="630" y="62" width="300" height="220" fill="#a9d4e5"/>
    <rect x="630" y="282" width="300" height="220" fill="#87a06e"/>
    <line x1="330" y1="62" x2="330" y2="502" stroke="#f7f5ef" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="630" y1="62" x2="630" y2="502" stroke="#f7f5ef" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="30" y1="282" x2="930" y2="282" stroke="#3a3b37" stroke-width="2.5"/>
    <rect x="30" y="62" width="900" height="440" fill="none" stroke="#282b29" stroke-width="2.5"/>
    <text x="180" y="92" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">MARS · FORMATION</text>
    <text x="180" y="118" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">the clock starts</text>
    <circle cx="180.0" cy="282.0" r="74" fill="#f7f5ef" fill-opacity="0.55"/>
    <circle cx="180.0" cy="282.0" r="70" fill="#6f5a86"/>
    <circle cx="180.0" cy="282.0" r="70" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="180" y="331" text-anchor="middle" fill="#f7f5ef" font-size="22">⁴⁰K</text>
    <text x="180" y="444" text-anchor="middle" fill="#f7f5ef" font-size="22">all ⁴⁰K, no argon yet</text>
    <text x="480" y="92" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">EARTH · LABORATORY</text>
    <text x="480" y="118" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">at discovery</text>
    <circle cx="480.0" cy="282.0" r="74" fill="#f7f5ef" fill-opacity="0.55"/>
    <path d="M480.0 282.0 L480.00 212.00 A70 70 0 0 1 503.64 216.11 Z" fill="#df7650"/>
    <path d="M480.0 282.0 L503.64 216.11 A70 70 0 0 1 521.69 225.77 Z" fill="#16171a"/>
    <path d="M480.0 282.0 L521.69 225.77 A70 70 0 1 1 480.00 212.00 Z" fill="#6f5a86"/>
    <line x1="480.0" y1="282.0" x2="480.00" y2="212.00" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="480.0" y1="282.0" x2="503.64" y2="216.11" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="480.0" y1="282.0" x2="521.69" y2="225.77" stroke="#f7f5ef" stroke-width="2.5"/>
    <circle cx="480.0" cy="282.0" r="70" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="467" y="329" text-anchor="middle" fill="#f7f5ef" font-size="22">⁴⁰K</text>
    <line x1="482.0" y1="168" x2="511.4" y2="223.4" stroke="#282b29" stroke-width="1.6"/>
    <text x="476.0" y="174" text-anchor="end" fill="#282b29" font-size="18">lost ⁴⁰Ar</text>
    <line x1="482.0" y1="194" x2="491.4" y2="216.5" stroke="#282b29" stroke-width="1.6"/>
    <text x="476.0" y="200" text-anchor="end" fill="#282b29" font-size="18">remaining ⁴⁰Ar</text>
    <text x="480" y="444" text-anchor="middle" fill="#f7f5ef" font-size="22">⁴⁰K decayed into ⁴⁰Ar</text>
    <text x="480" y="470" text-anchor="middle" fill="#f7f5ef" fill-opacity="0.85" font-size="20">some ⁴⁰Ar has escaped</text>
    <text x="780" y="92" text-anchor="middle" fill="#282b29" font-size="23" letter-spacing="1.2">EARTH · LABORATORY</text>
    <text x="780" y="118" text-anchor="middle" fill="#282b29" fill-opacity="0.72" font-size="21">after irradiation</text>
    <circle cx="780.0" cy="282.0" r="74" fill="#f7f5ef" fill-opacity="0.55"/>
    <path d="M780.0 282.0 L780.00 212.00 A70 70 0 0 1 803.64 216.11 Z" fill="#df7650"/>
    <path d="M780.0 282.0 L803.64 216.11 A70 70 0 0 1 821.69 225.77 Z" fill="#16171a"/>
    <path d="M780.0 282.0 L821.69 225.77 A70 70 0 0 1 848.66 295.65 Z" fill="#3f86b0"/>
    <path d="M780.0 282.0 L848.66 295.65 A70 70 0 1 1 780.00 212.00 Z" fill="#6f5a86"/>
    <line x1="780.0" y1="282.0" x2="780.00" y2="212.00" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="282.0" x2="803.64" y2="216.11" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="282.0" x2="821.69" y2="225.77" stroke="#f7f5ef" stroke-width="2.5"/>
    <line x1="780.0" y1="282.0" x2="848.66" y2="295.65" stroke="#f7f5ef" stroke-width="2.5"/>
    <circle cx="780.0" cy="282.0" r="70" fill="none" stroke="#282b29" stroke-width="3"/>
    <text x="749" y="316" text-anchor="middle" fill="#f7f5ef" font-size="22">⁴⁰K</text>
    <line x1="782.0" y1="142" x2="842.0" y2="258.1" stroke="#282b29" stroke-width="1.6"/>
    <text x="776.0" y="148" text-anchor="end" fill="#282b29" font-size="18">³⁹Ar</text>
    <line x1="782.0" y1="168" x2="811.4" y2="223.4" stroke="#282b29" stroke-width="1.6"/>
    <text x="776.0" y="174" text-anchor="end" fill="#282b29" font-size="18">lost ⁴⁰Ar</text>
    <line x1="782.0" y1="194" x2="791.4" y2="216.5" stroke="#282b29" stroke-width="1.6"/>
    <text x="776.0" y="200" text-anchor="end" fill="#282b29" font-size="18">remaining ⁴⁰Ar</text>
    <text x="780" y="444" text-anchor="middle" fill="#f7f5ef" font-size="22">neutrons made ³⁹Ar from ³⁹K</text>
    <text x="780" y="470" text-anchor="middle" fill="#f7f5ef" fill-opacity="0.85" font-size="20">how much escaped is unknown</text>
    <defs><marker id="tarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#59605c"/></marker></defs>
    <line x1="180" y1="502" x2="160" y2="558" stroke="#59605c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="480" y1="502" x2="700" y2="558" stroke="#59605c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="780" y1="502" x2="770" y2="558" stroke="#59605c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="130" y1="570" x2="918" y2="570" stroke="#59605c" stroke-width="3" marker-end="url(#tarrow)"/>
    <line x1="160" y1="559" x2="160" y2="581" stroke="#59605c" stroke-width="3"/>
    <text x="160" y="608" text-anchor="middle" fill="#59605c" font-size="22">1300 My ago</text>
    <line x1="700" y1="559" x2="700" y2="581" stroke="#59605c" stroke-width="3"/>
    <text x="700" y="608" text-anchor="middle" fill="#59605c" font-size="22">present</text>
    <line x1="770" y1="559" x2="770" y2="581" stroke="#59605c" stroke-width="3"/>
    <text x="770" y="638" text-anchor="middle" fill="#59605c" font-size="22">weeks later</text>
    <text x="430" y="548" text-anchor="middle" fill="#59605c" font-size="21">1.3 billion years</text>
    <text x="735" y="548" text-anchor="middle" fill="#59605c" font-size="21">days</text>
  </g>
</svg>
